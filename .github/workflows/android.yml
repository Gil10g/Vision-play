
name: Construir APK Vision Play

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Preparar Java
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Criar projeto Android
        run: |
          mkdir -p app/src/main/java/com/visionplay/app
          mkdir -p app/src/main/res/values
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "VisionPlay"
          include(":app")
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.visionplay.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.visionplay.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Vision Play"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          package com.visionplay.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.net.Uri;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Button;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              TextView status;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  LinearLayout layout = new LinearLayout(this);
                  layout.setOrientation(LinearLayout.VERTICAL);
                  layout.setGravity(Gravity.CENTER);
                  layout.setPadding(28, 28, 28, 28);
                  layout.setBackgroundColor(Color.rgb(18, 24, 38));

                  TextView title = new TextView(this);
                  title.setText("VISION PLAY");
                  title.setTextSize(30);
                  title.setTextColor(Color.WHITE);
                  title.setGravity(Gravity.CENTER);
                  layout.addView(title);

                  TextView subtitle = new TextView(this);
                  subtitle.setText("Vídeos • Música • Tradução");
                  subtitle.setTextSize(18);
                  subtitle.setTextColor(Color.LTGRAY);
                  subtitle.setPadding(0, 20, 0, 25);
                  layout.addView(subtitle);

                  status = new TextView(this);
                  status.setText("Criado por Gil da Paixão");
                  status.setTextColor(Color.WHITE);
                  status.setGravity(Gravity.CENTER);
                  layout.addView(status);

                  addButton(layout, "ESCOLHER VÍDEO", "video/*");
                  addButton(layout, "ESCOLHER MÚSICA", "audio/*");

                  Button translate = new Button(this);
                  translate.setText("TRADUZIR");
                  layout.addView(translate);

                  translate.setOnClickListener(v -> {
                      Intent i = new Intent(Intent.ACTION_VIEW,
                          Uri.parse("https://translate.google.com/"));
                      startActivity(i);
                  });

                  setContentView(layout);
              }

              void addButton(LinearLayout layout, String label, String type) {
                  Button button = new Button(this);
                  button.setText(label);
                  layout.addView(button);

                  button.setOnClickListener(v -> {
                      Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                      intent.setType(type);
                      try {
                          startActivityForResult(intent, 1);
                      } catch (Exception e) {
                          Toast.makeText(this,
                              "Não foi possível abrir os ficheiros",
                              Toast.LENGTH_SHORT).show();
                      }
                  });
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode,
                                              Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (resultCode == RESULT_OK && data != null) {
                      status.setText("Ficheiro selecionado com sucesso!");
                  }
              }
          }
          
          EOF

      - name: Construir APK
        run: gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Vision-Play-APK
          path: app/build/outputs/apk/debug/app-debug.apk
